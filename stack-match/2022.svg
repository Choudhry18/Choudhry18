<svg xmlns="http://www.w3.org/2000/svg" width="282" height="150" viewBox="0 0 282 150" role="img" aria-labelledby="title description">
  <title id="title">Stack Match</title>
  <desc id="description">Tiles for Java fall into place and three Java tiles match.</desc>
  <style>
    .surface { fill: #f6f8fa; stroke: #d1d9e0; }
    .drop { animation: drop .62s cubic-bezier(.24,.78,.27,1) both; }
    .swap-down { animation: swap-down .36s 1.16s ease-in-out both; }
    .swap-up { animation: swap-up .36s 1.16s ease-in-out both; }
    .match { animation: reveal 1.75s both; }
    @keyframes drop {
      0% { transform: translateY(-140px); opacity: 0; }
      15% { opacity: 1; }
      82% { transform: translateY(3px); }
      100% { transform: translateY(0); }
    }
    @keyframes swap-down {
      0% { transform: translateY(44px); }
      50% { transform: translate(-12px, 22px); }
    }
    @keyframes swap-up {
      0% { transform: translateY(-44px); }
      50% { transform: translate(12px, -22px); }
    }
    @keyframes reveal { 0%, 87% { opacity: 0; } 100% { opacity: 1; } }
    @media (prefers-color-scheme: dark) {
      .surface { fill: #151b23; stroke: #3d444d; }
    }
    @media (prefers-reduced-motion: reduce) {
      .drop, .swap-down, .swap-up, .match { animation: none; }
    }
  </style>
  <defs>
    <linearGradient id="color0" x2="0%" y2="100%">
      <stop stop-color="#fce1cd"/><stop offset="1" stop-color="#eaba96"/>
    </linearGradient>
    <g id="piece0">
      <rect x="1" y="1" width="36" height="36" rx="9"
        fill="url(#color0)" stroke="#24292f" stroke-opacity=".25"/>
      <path d="M9 5h20" stroke="#fff" stroke-opacity=".65" stroke-linecap="round"/>
      <ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 128 128" x="7" y="7" width="24" height="24"><ns0:path fill="#0074BD" d="M47.617 98.12s-4.767 2.774 3.397 3.71c9.892 1.13 14.947.968 25.845-1.092 0 0 2.871 1.795 6.873 3.351-24.439 10.47-55.308-.607-36.115-5.969zm-2.988-13.665s-5.348 3.959 2.823 4.805c10.567 1.091 18.91 1.18 33.354-1.6 0 0 1.993 2.025 5.132 3.131-29.542 8.64-62.446.68-41.309-6.336z" /><ns0:path fill="#EA2D2E" d="M69.802 61.271c6.025 6.935-1.58 13.17-1.58 13.17s15.289-7.891 8.269-17.777c-6.559-9.215-11.587-13.792 15.635-29.58 0 .001-42.731 10.67-22.324 34.187z" /><ns0:path fill="#0074BD" d="M102.123 108.229s3.529 2.91-3.888 5.159c-14.102 4.272-58.706 5.56-71.094.171-4.451-1.938 3.899-4.625 6.526-5.192 2.739-.593 4.303-.485 4.303-.485-4.953-3.487-32.013 6.85-13.743 9.815 49.821 8.076 90.817-3.637 77.896-9.468zM49.912 70.294s-22.686 5.389-8.033 7.348c6.188.828 18.518.638 30.011-.326 9.39-.789 18.813-2.474 18.813-2.474s-3.308 1.419-5.704 3.053c-23.042 6.061-67.544 3.238-54.731-2.958 10.832-5.239 19.644-4.643 19.644-4.643zm40.697 22.747c23.421-12.167 12.591-23.86 5.032-22.285-1.848.385-2.677.72-2.677.72s.688-1.079 2-1.543c14.953-5.255 26.451 15.503-4.823 23.725 0-.002.359-.327.468-.617z" /><ns0:path fill="#EA2D2E" d="M76.491 1.587S89.459 14.563 64.188 34.51c-20.266 16.006-4.621 25.13-.007 35.559-11.831-10.673-20.509-20.07-14.688-28.815C58.041 28.42 81.722 22.195 76.491 1.587z" /><ns0:path fill="#0074BD" d="M52.214 126.021c22.476 1.437 57-.8 57.817-11.436 0 0-1.571 4.032-18.577 7.231-19.186 3.612-42.854 3.191-56.887.874 0 .001 2.875 2.381 17.647 3.331z" /></ns0:svg>
    </g>
    <clipPath id="board"><rect x="6" y="6" width="270" height="138" rx="6"/></clipPath>
  </defs>
  <rect class="surface" x=".5" y=".5" width="281" height="149" rx="10"/>
  <g clip-path="url(#board)">
    <g transform="translate(144 12)">
      <g class="drop" style="animation-delay:400ms">
        <g><use href="#piece0"/></g>
      </g>
    </g>
    <g transform="translate(56 56)">
      <g class="drop" style="animation-delay:170ms">
        <g><use href="#piece0"/></g>
      </g>
    </g>
    <g transform="translate(100 56)">
      <g class="drop" style="animation-delay:230ms">
        <g><use href="#piece0"/></g>
      </g>
    </g>
    <g transform="translate(144 56)">
      <g class="drop" style="animation-delay:290ms">
        <g><use href="#piece0"/></g>
      </g>
    </g>
    <g transform="translate(12 100)">
      <g class="drop" style="animation-delay:0ms">
        <g><use href="#piece0"/></g>
      </g>
    </g>
    <g transform="translate(232 100)">
      <g class="drop" style="animation-delay:300ms">
        <g><use href="#piece0"/></g>
      </g>
    </g>
    <rect class="match" x="55" y="55" width="128" height="40" rx="10"
      fill="none" stroke="#2da44e" stroke-width="2"/>
  </g>
</svg>
